<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#fff8fb" />
  <meta name="description" content="Vibely — chat as friends. When the vibe is right, something serious can happen." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="vibely-icon.svg" type="image/svg+xml" />
  <title>Vibely — Meet at your own pace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="premium.css" />
  <link rel="stylesheet" href="live.css?v=0.5.2" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <a class="brand" href="#discover" aria-label="Vibely home">
        <span class="brand-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 34S5 25.3 5 15.2C5 9.7 9.2 6 14 6c2.6 0 4.7 1.1 6 3 1.3-1.9 3.4-3 6-3 4.8 0 9 3.7 9 9.2C35 25.3 20 34 20 34Z"/><path class="pulse-line" d="M9 19h7l3-6 4 13 3-7h5"/></svg></span>
        <span class="brand-copy"><strong>Vibely</strong><small>MEET AT YOUR OWN PACE</small></span>
      </a>
      <div class="side-label">YOUR SPACE</div>
      <nav class="side-nav" aria-label="Main navigation">
        <button class="nav-item active" data-view="discover"><span class="nav-icon">⌕</span><span>Discover</span></button>
        <button class="nav-item" data-view="likes"><span class="nav-icon">♡</span><span>Likes & intros</span><span class="nav-count" id="likesCount">3</span></button>
        <button class="nav-item" data-view="chats"><span class="nav-icon">▱</span><span>Chats</span><span class="nav-dot"></span></button>
      </nav>
      <div class="side-label side-label-spaced">MORE FOR YOU</div>
      <nav class="side-nav" aria-label="More navigation">
        <button class="nav-item" data-view="premium"><span class="nav-icon crown">♛</span><span>Vibely Plus</span></button>
        <button class="nav-item" data-view="profile"><span class="nav-icon">◉</span><span>My profile</span></button>
      </nav>
      <div class="sidebar-promo"><div class="promo-crown">♛</div><strong>A little more spark?</strong><p>See who likes you and meet at your own pace.</p><button class="button button-light button-small" data-view="premium">Explore Plus <span>→</span></button><div class="promo-glow"></div></div>
      <button class="user-chip" data-view="profile"><span class="mini-avatar me-avatar">S</span><span class="user-info"><strong>Sana, 28</strong><small>View your profile</small></span><span class="more">···</span></button>
    </aside>

    <main class="main-area">
      <header class="topbar">
        <div class="mobile-brand"><span class="brand-mark small-mark"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 34S5 25.3 5 15.2C5 9.7 9.2 6 14 6c2.6 0 4.7 1.1 6 3 1.3-1.9 3.4-3 6-3 4.8 0 9 3.7 9 9.2C35 25.3 20 34 20 34Z"/><path class="pulse-line" d="M9 19h7l3-6 4 13 3-7h5"/></svg></span><b>Vibely</b></div>
        <div class="location-pill"><span>⌖</span> Imphal <span class="chevron">⌄</span></div>
        <div class="top-actions"><button class="icon-button notification-button" aria-label="Notifications" title="Notifications">♧<i></i></button><button class="avatar-button me-avatar" data-view="profile" aria-label="Your profile">S</button></div>
      </header>
      <section class="content" id="viewRoot" aria-live="polite"></section>
      <nav class="mobile-nav" aria-label="Mobile navigation">
        <button class="mobile-nav-item active" data-view="discover"><span>⌕</span><small>Discover</small></button>
        <button class="mobile-nav-item" data-view="likes"><span>♡<i class="mobile-badge">3</i></span><small>Likes</small></button>
        <button class="mobile-nav-item" data-view="chats"><span>▱</span><small>Chats</small></button>
        <button class="mobile-nav-item" data-view="premium"><span>♛</span><small>Plus</small></button>
        <button class="mobile-nav-item" data-view="profile"><span>◉</span><small>Profile</small></button>
      </nav>
    </main>
  </div>

  <div id="modalRoot"></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="config.js"></script>
  <script src="live.js?v=0.5.2"></script>
  <script src="app.js"></script>
  <script>window.sparkLive?.start();</script>
  <script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('./sw.js').catch(()=>{});</script>
</body>
</html>
